services:
  api-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-chatbot-simplify
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: ${PORT:-5555}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-https://opencode.ai/zen/v1}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-gemini-3.7-flash}
      OPENCODE_MAX_TOKENS: ${OPENCODE_MAX_TOKENS:-1024}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-30}
      MAX_PROMPT_LENGTH: ${MAX_PROMPT_LENGTH:-1000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    ports:
      - "${PORT:-5555}:${PORT:-5555}"
